name: CD

# Deploys on every merge to main (small team, trunk-based — no separate
# release-train process needed at this scale) plus a manual trigger for
# re-running a deploy without a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for GitHub OIDC -> AWS role assumption
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
  deploy:
    name: Build & sync to S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # VITE_API_BASE_URL is a build-time value — Vite inlines
      # import.meta.env.VITE_API_BASE_URL into the compiled bundle, so it
      # has to be a real env var here, not something set at deploy time.
      # It's an absolute cross-origin URL (the backend's EC2 Elastic IP,
      # not a relative /api path) because frontend (S3) and backend (EC2)
      # are different origins now — see the note in http.js and the repo
      # README for why @CrossOrigin("*") on every controller is required.
      - name: Build
        run: npm run build

      # No long-lived AWS access keys stored as secrets: this exchanges
      # the workflow's short-lived GitHub OIDC token for temporary AWS
      # credentials via the IAM role in infra/iam_github_oidc.tf, which
      # trusts only this exact repo (see that file's condition). The role
      # can write only to this one S3 bucket — nothing else, and nothing
      # belonging to the backend.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Two passes so index.html and the hashed assets get opposite
      # caching: the hashed JS/CSS filenames are safe to cache
      # indefinitely (a new deploy gets new filenames), but index.html
      # must never be cached — it is what points the browser at the
      # current filenames, and a cached stale index.html is what makes a
      # deploy silently not show up for returning visitors.
      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET" \
            --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html (no cache)
        run: |
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache"
